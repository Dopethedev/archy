[project]
name = "jarvis"
version = "0.2.0"
description = "A local voice assistant: wake phrase, speech in, speech out, and a dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    # the VAD runs on onnxruntime directly rather than through openWakeWord,
    # so it is named here even though those packages would pull it in
    "onnxruntime>=1.20.0",
    "openwakeword>=0.4.0",
    # looking at the screen where grim does not exist (Windows, macOS, X11);
    # on Wayland grim and ffmpeg are used and this is not needed
    "pillow>=11.0.0",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
