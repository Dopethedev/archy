[project]
name = "archy"
version = "0.3.3"
description = "A local voice assistant: wake phrase, speech in, speech out, and a dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    # the VAD runs on onnxruntime directly rather than through openWakeWord,
    # so it is named here even though those packages would pull it in
    "onnxruntime>=1.20.0",
    "openwakeword>=0.4.0",
    # looking at the screen where grim does not exist (Windows, macOS, X11);
    # on Wayland grim and ffmpeg are used and this is not needed
    "pillow>=11.0.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
]

# The fallback voice, and nothing else uses it. piper is GPL-3.0-or-later while
# this repository is MIT, and the code runs the piper program as a separate
# process rather than importing it, so keeping it out of a plain install keeps
# that separation clean. Kokoro is the voice; this is what speaks if the kokoro
# files are missing.
[project.optional-dependencies]
fallback-voice = ["piper-tts>=1.8.0"]

[project.scripts]
archy = "archy.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
