[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
