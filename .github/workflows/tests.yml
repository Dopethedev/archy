# Does the logic still hold on another machine?
#
# The full suite needs a microphone, the voice models and a few Linux tools (grim,
# pacman, clamav), so it stays local. These are the groups that need none of
# that: the wake matcher, the phrasings, the reminders, the local intents, the
# memory store, the microphone switch, the dashboard server, connectivity
# classification, the local chain, and what each part does when it cannot start.
#
# Windows and macOS are in the list on purpose. The assistant is written on Linux,
# and the parts that are platform-specific are the ones that will not port: the
# sweep, the screen capture, the machine readings. Everything that parses and
# decides is meant to be portable, and a claim like that is worth having a runner
# check rather than a sentence in the README. The macOS runner is the only place
# where the mach cpu call, screencapture and launchd are the real thing.
#
# The permission group needs node, because the gate it tests is the pi extension
# that actually runs, not a copy of its policy: node strips the types and executes
# the file. All three runners ship node, and a runner without it fails loudly
# instead of passing a suite that checked nothing.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # sounddevice loads PortAudio when it is imported, so a machine without
      # the library cannot even import the audio module. Windows wheels carry it;
      # Ubuntu needs the package.
      - name: PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2

      - name: Install
        run: uv sync

      - name: Logic groups
        shell: bash
        run: |
          failed=0
          for t in test_wake_phrase test_phrasings test_reminders test_mic_state \
                   test_memory_store test_intents test_briefing test_hud_security \
                   test_platform test_macos test_fetch_models test_net \
                   test_degrades test_local_chain test_permissions test_privacy; do
            echo "=== $t ==="
            if uv run python "tests/$t.py"; then :; else failed=$((failed+1)); fi
          done
          echo "groups that failed: $failed"
          test "$failed" -eq 0
